version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The gcp-auth composite action pins its own actions; `directory: /` does not
  # cover nested action.yml files.
  - package-ecosystem: github-actions
    directory: /.github/actions/gcp-auth
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /.github/actions/e2e-stack
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Dockerfile + docker-compose base images are digest-pinned and otherwise rot.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # This repository uses Bun's text lockfile. The `bun` ecosystem updates both
  # manifests and bun.lock; using `npm` only updated manifests, causing every
  # CI job with `bun install --frozen-lockfile` to fail.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # TypeScript 7 is the native-preview release. Its API is not yet supported
    # by the ESLint TypeScript tooling used in this repository.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # ESLint 10 removed legacy APIs that three of our lint loaders still
      # call, so `bun run lint` crashes on load. All three must be fixed:
      #   - eslint-plugin-react 7.37.5 (latest; peer eslint ^9.7, pulled in
      #     by eslint-config-next): `contextOrFilename.getFilename`.
      #   - eslint-plugin-tailwindcss 3.18.3: `context.getSourceCode`. 4.x
      #     supports eslint 10 but needs Tailwind 4 (we are on 3.4).
      #   - eslint-config-next's bundled Babel parser for .js/.mjs files:
      #     `scopeManager.addGlobals`.
      # Crashes reproduced 2026-10-16 (eslint 10.12.0, eslint-config-next
      # 16.3.8); peer ranges re-checked 2026-10-18, unchanged. A new
      # eslint-plugin-react release alone does not unblock this.
      - dependency-name: eslint
        versions:
          - ">=10.0.0"
