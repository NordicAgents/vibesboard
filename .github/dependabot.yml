version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # The gcp-auth composite action pins its own actions; `directory: /` does not
  # cover nested action.yml files.
  - package-ecosystem: github-actions
    directory: /.github/actions/gcp-auth
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /.github/actions/e2e-stack
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Dockerfile + docker-compose base images are digest-pinned and otherwise rot.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # This repository uses Bun's text lockfile. The `bun` ecosystem updates both
  # manifests and bun.lock; using `npm` only updated manifests, causing every
  # CI job with `bun install --frozen-lockfile` to fail.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # TypeScript 7 is the native-preview release. Its API is not yet supported
    # by the ESLint TypeScript tooling used in this repository.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # ESLint 10 removed the legacy rule-context API that eslint-plugin-react
      # (7.37.5, latest; peer eslint ^9.7, pulled in by eslint-config-next)
      # still calls, so `bun run lint` crashes on load. Re-checked 2026-10-16.
      # Drop this once eslint-plugin-react ships an eslint 10 peer range.
      - dependency-name: eslint
        versions:
          - ">=10.0.0"
