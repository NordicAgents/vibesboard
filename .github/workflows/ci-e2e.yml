name: E2E

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-e2e-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright suites
    runs-on: [self-hosted, Linux, X64]
    # Backstop only — both suites set a lower globalTimeout so Playwright aborts
    # itself and still uploads its report. Without this, a wedged dev server ran
    # to GitHub's 6-hour job ceiling (run 31392110921 burned exactly that).
    timeout-minutes: 30
    env:
      # Match docker-compose.dev.yml + packages/adapter-postgres/docker/init.sql
      DATABASE_URL: postgres://vibesboard_app:vibesboard_app@localhost:5432/vibesboard_dev
      DATABASE_MIGRATE_URL: postgres://vibesboard_migrate:vibesboard_migrate@localhost:5432/vibesboard_dev
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: vibesboard-files
      S3_ACCESS_KEY_ID: vibesboard
      S3_SECRET_ACCESS_KEY: vibesboard
      S3_FORCE_PATH_STYLE: 'true'
      # better-auth needs a secret to boot; the Playwright config points the app
      # at a local mock OpenAI server, so no real OpenAI key is required.
      BETTER_AUTH_SECRET: ci-e2e-better-auth-secret-0123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      # Required by playwright.local.config.ts, which fails fast if any is unset.
      # All are dev-only throwaways: ENCRYPTION_KEY is a CryptoJS AES passphrase
      # (any non-empty string), the rest are plain shared-secret comparisons.
      # Nothing encrypted with this key outlives the CI run.
      ENCRYPTION_KEY: ci-e2e-encryption-key-0123456789
      CRON_SECRET: ci-e2e-cron-secret
      ACCESS_GATE_SECRET: ci-e2e-access-gate-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.18

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bring up Postgres + MinIO via docker compose
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres minio

      - name: Bootstrap MinIO bucket
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO reachable"; break
            fi
            echo "Waiting for MinIO... ($i/30)"; sleep 2
            if [ "$i" = "30" ]; then
              echo "MinIO never came up"; docker compose -f docker-compose.dev.yml logs minio; exit 1
            fi
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 -c "
            mc alias set local http://localhost:9000 vibesboard vibesboard &&
            (mc mb -p local/vibesboard-files || true) &&
            mc anonymous set none local/vibesboard-files
          "

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright E2E
        # The Playwright config boots a mock OpenAI server + `next dev`
        # (OPENAI_BASE_URL pointed at the mock so the model is stubbed at the
        # network boundary), seeds an E2E user/tenant in globalSetup, then runs.
        run: bun run test:e2e
        working-directory: apps/web

      - name: Run local Playwright E2E (deep suite)
        # The e2e/local/ suite is the deep one — agents, chat, settings, BYO-LLM,
        # public widget, conversations, knowledge base, sharing, admin panel,
        # tenant flow and cross-tenant isolation. It used to be hand-run only, so
        # it guarded nothing on a PR. Its config seeds the extra accounts it
        # needs (an outsider and a superadmin) in its own globalSetup, and now
        # reads DATABASE_URL / S3_ENDPOINT from the environment above.
        run: bun run test:e2e:local
        working-directory: apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload local Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-local
          path: apps/web/playwright-report-local/
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs
