name: E2E

on:
  pull_request:
    branches: [dev, main]
  # So the deep suite can still be run deliberately while it is parked (below).
  workflow_dispatch:

concurrency:
  group: ci-e2e-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared by both jobs below.
env:
  # Match docker-compose.dev.yml + packages/adapter-postgres/docker/init.sql
  DATABASE_URL: postgres://vibesboard_app:vibesboard_app@localhost:5432/vibesboard_dev
  DATABASE_MIGRATE_URL: postgres://vibesboard_migrate:vibesboard_migrate@localhost:5432/vibesboard_dev
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: vibesboard-files
  S3_ACCESS_KEY_ID: vibesboard
  S3_SECRET_ACCESS_KEY: vibesboard
  S3_FORCE_PATH_STYLE: "true"
  # better-auth needs a secret to boot; the Playwright config points the app
  # at a local mock OpenAI server, so no real OpenAI key is required.
  BETTER_AUTH_SECRET: ci-e2e-better-auth-secret-0123456789
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  # Required by playwright.local.config.ts, which fails fast if any is unset.
  # All are dev-only throwaways: ENCRYPTION_KEY is a CryptoJS AES passphrase
  # (any non-empty string), the rest are plain shared-secret comparisons.
  # Nothing encrypted with this key outlives the CI run.
  ENCRYPTION_KEY: ci-e2e-encryption-key-0123456789
  CRON_SECRET: ci-e2e-cron-secret
  ACCESS_GATE_SECRET: ci-e2e-access-gate-secret

# The suites remain separate jobs so each gets a fresh, isolated VM and a clear
# check result. Pull-request code never reaches the persistent deployment fleet.
jobs:
  e2e-core:
    name: Playwright core suite
    runs-on: ubuntu-latest
    # Backstop only — the config sets a lower globalTimeout (10 min) so
    # Playwright aborts itself and still uploads its report. Without this, a
    # wedged dev server ran to GitHub's 6-hour job ceiling (run 31392110921
    # burned exactly that).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/e2e-stack

      - name: Run Playwright E2E
        # The specs directly under apps/web/e2e/. The Playwright config boots a
        # mock OpenAI server + `next dev` (OPENAI_BASE_URL pointed at the mock
        # so the model is stubbed at the network boundary), seeds an E2E
        # user/tenant in globalSetup, then runs. Completes in well under a
        # minute on the hosted runners.
        run: bun run test:e2e
        working-directory: apps/web

      - name: Run tenant-isolation E2E
        # Keep the highest-risk cross-tenant IDOR coverage in the fast core job
        # as an early signal, in addition to its coverage in the deep suite.
        # This spec uses the same mocked-provider boundary and seeds its own
        # outsider account.
        run: bunx playwright test --config playwright.local.config.ts 12-tenant-isolation.spec.ts
        working-directory: apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs

      # Keep explicit cleanup for deterministic local action replays.
      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans

  e2e-deep:
    name: Playwright deep suite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Backstop only — the config sets a lower globalTimeout (20 min).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The public hosted environment terminates the single 209-test process
      # after roughly eight minutes. Two isolated shards retain the full suite
      # while keeping each process below that external runtime limit.
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/e2e-stack

      - name: Run local Playwright E2E (deep suite)
        # The e2e/local/ suite — agents, chat, settings, BYO-LLM, public widget,
        # conversations, knowledge base, sharing, admin panel, tenant flow and
        # cross-tenant isolation. Its globalSetup seeds everything it needs
        # (including the base E2E user, plus an outsider and a superadmin), so
        # it does not depend on the core job having run.
        run: bun run test:e2e:local -- --shard=${{ matrix.shard }}
        working-directory: apps/web

      - name: Upload local Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Matrix jobs cannot upload to the same artifact name. job-index is
          # a stable, slash-free identifier for each shard.
          name: playwright-report-local-${{ strategy.job-index }}
          path: apps/web/playwright-report-local/
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v --remove-orphans
