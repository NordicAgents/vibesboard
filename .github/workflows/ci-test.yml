name: Tests

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-test-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Adapter test envs — match docker-compose.dev.yml and packages/adapter-postgres/docker/init.sql
      DATABASE_URL: postgres://vibesboard_app:vibesboard_app@localhost:5432/vibesboard_dev
      DATABASE_MIGRATE_URL: postgres://vibesboard_migrate:vibesboard_migrate@localhost:5432/vibesboard_dev
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: vibesboard-files
      S3_ACCESS_KEY_ID: vibesboard
      S3_SECRET_ACCESS_KEY: vibesboard
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bring up Postgres + MinIO via docker compose
        run: docker compose -f docker-compose.dev.yml up -d postgres minio minio-init

      - name: Wait for Postgres healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.dev.yml ps postgres | grep -q "healthy"; then
              echo "Postgres healthy"; exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"; sleep 2
          done
          echo "Postgres failed to reach healthy state"; docker compose -f docker-compose.dev.yml logs postgres; exit 1

      - name: Wait for MinIO bucket bootstrap
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.dev.yml ps minio-init | grep -qE "exited \(0\)|Exit 0"; then
              echo "MinIO init complete"; exit 0
            fi
            echo "Waiting for minio-init... ($i/30)"; sleep 2
          done
          echo "minio-init never exited cleanly"; docker compose -f docker-compose.dev.yml logs minio-init; exit 1

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run tests
        run: pnpm test

      - name: Capture docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs
