name: Tests

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-test-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: [self-hosted, Linux, X64]
    env:
      # Adapter test envs — match docker-compose.dev.yml and packages/adapter-postgres/docker/init.sql
      DATABASE_URL: postgres://vibesboard_app:vibesboard_app@localhost:5432/vibesboard_dev
      DATABASE_MIGRATE_URL: postgres://vibesboard_migrate:vibesboard_migrate@localhost:5432/vibesboard_dev
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: vibesboard-files
      S3_ACCESS_KEY_ID: vibesboard
      S3_SECRET_ACCESS_KEY: vibesboard
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.18

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bring up Postgres + MinIO via docker compose
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres minio

      - name: Bootstrap MinIO bucket
        run: |
          # Wait until MinIO answers /minio/health/live (the compose healthcheck
          # already covers this but we re-check from the runner's perspective
          # to ensure host networking is reachable).
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO reachable"; break
            fi
            echo "Waiting for MinIO... ($i/30)"; sleep 2
            if [ "$i" = "30" ]; then
              echo "MinIO never came up"; docker compose -f docker-compose.dev.yml logs minio; exit 1
            fi
          done
          # Create the bucket via the mc client image. The image's ENTRYPOINT
          # is 'mc'; override to sh so we can chain commands. --network host
          # so 'localhost:9000' resolves to the runner-bound minio port.
          docker run --rm --network host --entrypoint sh minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 -c "
            mc alias set local http://localhost:9000 vibesboard vibesboard &&
            (mc mb -p local/vibesboard-files || true) &&
            mc anonymous set none local/vibesboard-files &&
            mc ls local/
          "

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Run tests with coverage
        # Unified Vitest run across all workspace projects (single process,
        # worker-capped) + v8 coverage, gated by the ratchet threshold in
        # vitest.shared.mts.
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs
