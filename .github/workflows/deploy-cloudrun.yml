name: Deploy to Cloud Run

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "Dockerfile"
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    # Staging only — applies Drizzle migrations to the staging Postgres VM over
    # an IAP TCP tunnel before the service deploys. Prod has no Postgres yet.
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Open IAP tunnel to staging Postgres
        run: |
          gcloud compute start-iap-tunnel vibesboard-staging-pg 5432 \
            --local-host-port=localhost:5432 --zone=us-central1-a \
            --project=${{ secrets.GCP_PROJECT_ID }} &
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && break; sleep 1; done
      - name: Run migrations
        env:
          DATABASE_MIGRATE_URL: ${{ secrets.STAGING_DATABASE_MIGRATE_URL }}
        run: pnpm db:migrate

  deploy:
    needs: [migrate]
    # migrate is skipped on main (prod) — still allow prod to deploy.
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.ref_name == 'main' && 'PROD' || 'STAGING' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        env:
          REF_NAME: ${{ github.ref_name }}
          PROD_CLOUD_RUN_SERVICE: ${{ secrets.PROD_CLOUD_RUN_SERVICE }}
          STAGING_CLOUD_RUN_SERVICE: ${{ secrets.STAGING_CLOUD_RUN_SERVICE }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "ENV=prod" >> "$GITHUB_ENV"
            echo "CLOUD_RUN_SERVICE=$PROD_CLOUD_RUN_SERVICE" >> "$GITHUB_ENV"
          else
            echo "ENV=staging" >> "$GITHUB_ENV"
            echo "CLOUD_RUN_SERVICE=$STAGING_CLOUD_RUN_SERVICE" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vibeagent/app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_API_KEY || secrets.STAGING_NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.STAGING_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_PROJECT_ID || secrets.STAGING_NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.STAGING_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.STAGING_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_FIREBASE_APP_ID || secrets.STAGING_NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_APP_URL=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_APP_URL || secrets.STAGING_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_AUTH_GOOGLE=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_AUTH_GOOGLE || secrets.STAGING_NEXT_PUBLIC_AUTH_GOOGLE }}
            NEXT_PUBLIC_META_APP_ID=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_META_APP_ID || secrets.STAGING_NEXT_PUBLIC_META_APP_ID }}
            NEXT_PUBLIC_FB_LOGIN_CONFIG_ID=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_FB_LOGIN_CONFIG_ID || secrets.STAGING_NEXT_PUBLIC_FB_LOGIN_CONFIG_ID }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.STAGING_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: europe-north1
          image: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vibeagent/app:${{ github.sha }}
          # Direct VPC egress (staging only) so the service can reach the
          # private-IP Postgres VM; empty on prod (no-op).
          flags: ${{ github.ref_name == 'dev' && '--network=default --subnet=default --vpc-egress=private-ranges-only' || '' }}
          env_vars: |
            OPENAI_MODEL=gpt-4o-mini
            GCS_BUCKET_NAME=${{ github.ref_name == 'main' && secrets.PROD_GCS_BUCKET_NAME || secrets.STAGING_GCS_BUCKET_NAME }}
            NEXT_PUBLIC_APP_URL=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_APP_URL || secrets.STAGING_NEXT_PUBLIC_APP_URL }}
            NOTIFICATION_EMAIL_FROM=VibeAgent <notifications@vibeagent.com>
            ${{ github.ref_name == 'dev' && 'S3_ENDPOINT=https://storage.googleapis.com' || '' }}
            ${{ github.ref_name == 'dev' && 'S3_REGION=us-east-1' || '' }}
            ${{ github.ref_name == 'dev' && 'S3_BUCKET=vibeagent-files-staging' || '' }}
            ${{ github.ref_name == 'dev' && 'S3_FORCE_PATH_STYLE=false' || '' }}
            ${{ github.ref_name == 'dev' && format('BETTER_AUTH_URL={0}', secrets.STAGING_NEXT_PUBLIC_APP_URL) || '' }}
          secrets: |
            OPENAI_API_KEY=openai-api-key:latest
            WHATSAPP_ACCESS_TOKEN=whatsapp-access-token:latest
            VERIFY_TOKEN=whatsapp-verify-token:latest
            ENCRYPTION_KEY=encryption-key:latest
            CRON_SECRET=cron-secret:latest
            META_APP_SECRET=meta-app-secret:latest
            WHATSAPP_INBOX_VERIFY_TOKEN=whatsapp-inbox-verify-token:latest
            INSTAGRAM_INBOX_VERIFY_TOKEN=instagram-inbox-verify-token:latest
            RESEND_API_KEY=resend-api-key:latest
            STRIPE_SECRET_KEY=stripe-secret-key:latest
            STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest
            STRIPE_PRICE_PRO_BASE=stripe-price-pro-base:latest
            STRIPE_PRICE_PRO_OVERAGE=stripe-price-pro-overage:latest
            STRIPE_PRICE_TEAM_BASE=stripe-price-team-base:latest
            STRIPE_PRICE_TEAM_OVERAGE=stripe-price-team-overage:latest
            GOOGLE_CALENDAR_CLIENT_ID=google-calendar-client-id:latest
            GOOGLE_CALENDAR_CLIENT_SECRET=google-calendar-client-secret:latest
            GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest
            ACCESS_GATE_SECRET=access-gate-secret:latest
            ${{ github.ref_name == 'dev' && 'DATABASE_URL=database-url-staging:latest' || '' }}
            ${{ github.ref_name == 'dev' && 'DATABASE_MIGRATE_URL=database-migrate-url-staging:latest' || '' }}
            ${{ github.ref_name == 'dev' && 'BETTER_AUTH_SECRET=better-auth-secret-staging:latest' || '' }}
            ${{ github.ref_name == 'dev' && 'S3_ACCESS_KEY_ID=s3-access-key-id-staging:latest' || '' }}
            ${{ github.ref_name == 'dev' && 'S3_SECRET_ACCESS_KEY=s3-secret-access-key-staging:latest' || '' }}
