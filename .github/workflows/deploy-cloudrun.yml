name: Deploy to Cloud Run

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "Dockerfile"
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    # Applies Drizzle migrations to the target env's Postgres VM over an IAP TCP
    # tunnel before the service deploys. Runs for both staging (dev) and prod (main).
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.18
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Open IAP tunnel to the target Postgres VM
        # VM names and zone come from repository variables so the tracked file
        # carries no map of our infrastructure (see docs/deployment.md).
        env:
          PG_VM: ${{ github.ref_name == 'main' && vars.PROD_PG_VM_NAME || vars.STAGING_PG_VM_NAME }}
          PG_VM_ZONE: ${{ vars.PG_VM_ZONE }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          : "${PG_VM:?Repository variable PROD_PG_VM_NAME / STAGING_PG_VM_NAME is not set}"
          : "${PG_VM_ZONE:?Repository variable PG_VM_ZONE is not set}"
          gcloud compute start-iap-tunnel "$PG_VM" 5432 \
            --local-host-port=localhost:5432 --zone="$PG_VM_ZONE" \
            --project="$GCP_PROJECT" &
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && break; sleep 1; done
      - name: Run migrations
        env:
          DATABASE_MIGRATE_URL: ${{ github.ref_name == 'main' && secrets.PROD_DATABASE_MIGRATE_URL || secrets.STAGING_DATABASE_MIGRATE_URL }}
        run: bun run db:migrate

  deploy:
    needs: [migrate]
    # migrate is skipped on main (prod) — still allow prod to deploy.
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ github.ref_name == 'main' && 'PROD' || 'STAGING' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set environment
        env:
          REF_NAME: ${{ github.ref_name }}
          PROD_CLOUD_RUN_SERVICE: ${{ secrets.PROD_CLOUD_RUN_SERVICE }}
          STAGING_CLOUD_RUN_SERVICE: ${{ secrets.STAGING_CLOUD_RUN_SERVICE }}
          CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
          S3_BUCKET: ${{ github.ref_name == 'main' && vars.PROD_S3_BUCKET || vars.STAGING_S3_BUCKET }}
        run: |
          : "${CLOUD_RUN_REGION:?Repository variable CLOUD_RUN_REGION is not set}"
          : "${S3_BUCKET:?Repository variable PROD_S3_BUCKET / STAGING_S3_BUCKET is not set}"
          if [ "$REF_NAME" = "main" ]; then
            echo "ENV=prod" >> "$GITHUB_ENV"
            echo "CLOUD_RUN_SERVICE=$PROD_CLOUD_RUN_SERVICE" >> "$GITHUB_ENV"
          else
            echo "ENV=staging" >> "$GITHUB_ENV"
            echo "CLOUD_RUN_SERVICE=$STAGING_CLOUD_RUN_SERVICE" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vibeagent/app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_APP_URL || secrets.STAGING_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_AUTH_GOOGLE=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_AUTH_GOOGLE || secrets.STAGING_NEXT_PUBLIC_AUTH_GOOGLE }}
            NEXT_PUBLIC_META_APP_ID=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_META_APP_ID || secrets.STAGING_NEXT_PUBLIC_META_APP_ID }}
            NEXT_PUBLIC_FB_LOGIN_CONFIG_ID=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_FB_LOGIN_CONFIG_ID || secrets.STAGING_NEXT_PUBLIC_FB_LOGIN_CONFIG_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          image: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vibeagent/app:${{ github.sha }}
          # Direct VPC egress so the service can reach the private-IP Postgres VM
          # (both staging and prod run a private VM in the default network).
          flags: ${{ (github.ref_name == 'dev' || github.ref_name == 'main') && '--network=default --subnet=default --vpc-egress=private-ranges-only' || '' }}
          env_vars: |
            OPENAI_MODEL=gpt-4o-mini
            GCS_BUCKET_NAME=${{ github.ref_name == 'main' && secrets.PROD_GCS_BUCKET_NAME || secrets.STAGING_GCS_BUCKET_NAME }}
            NEXT_PUBLIC_APP_URL=${{ github.ref_name == 'main' && secrets.PROD_NEXT_PUBLIC_APP_URL || secrets.STAGING_NEXT_PUBLIC_APP_URL }}
            NOTIFICATION_EMAIL_FROM=${{ vars.NOTIFICATION_EMAIL_FROM }}
            ${{ (github.ref_name == 'dev' || github.ref_name == 'main') && 'S3_ENDPOINT=https://storage.googleapis.com' || '' }}
            ${{ (github.ref_name == 'dev' || github.ref_name == 'main') && 'S3_REGION=us-east-1' || '' }}
            S3_BUCKET=${{ github.ref_name == 'main' && vars.PROD_S3_BUCKET || (github.ref_name == 'dev' && vars.STAGING_S3_BUCKET) || '' }}
            ${{ (github.ref_name == 'dev' || github.ref_name == 'main') && 'S3_FORCE_PATH_STYLE=false' || '' }}
            ${{ github.ref_name == 'main' && format('BETTER_AUTH_URL={0}', secrets.PROD_NEXT_PUBLIC_APP_URL) || (github.ref_name == 'dev' && format('BETTER_AUTH_URL={0}', secrets.STAGING_NEXT_PUBLIC_APP_URL)) || '' }}
          secrets: |
            OPENAI_API_KEY=openai-api-key:latest
            WHATSAPP_ACCESS_TOKEN=whatsapp-access-token:latest
            VERIFY_TOKEN=whatsapp-verify-token:latest
            ENCRYPTION_KEY=encryption-key:latest
            CRON_SECRET=cron-secret:latest
            META_APP_SECRET=meta-app-secret:latest
            WHATSAPP_INBOX_VERIFY_TOKEN=whatsapp-inbox-verify-token:latest
            INSTAGRAM_INBOX_VERIFY_TOKEN=instagram-inbox-verify-token:latest
            RESEND_API_KEY=resend-api-key:latest
            GOOGLE_CALENDAR_CLIENT_ID=google-calendar-client-id:latest
            GOOGLE_CALENDAR_CLIENT_SECRET=google-calendar-client-secret:latest
            GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest
            AUTH_GOOGLE_ID=${{ github.ref_name == 'main' && 'google-oauth-client-id-prod:latest' || 'google-oauth-client-id:latest' }}
            AUTH_GOOGLE_SECRET=${{ github.ref_name == 'main' && 'google-oauth-client-secret-prod:latest' || 'google-oauth-client-secret:latest' }}
            ACCESS_GATE_SECRET=access-gate-secret:latest
            DATABASE_URL=${{ github.ref_name == 'main' && 'database-url-prod:latest' || (github.ref_name == 'dev' && 'database-url-staging:latest') || '' }}
            DATABASE_MIGRATE_URL=${{ github.ref_name == 'main' && 'database-migrate-url-prod:latest' || (github.ref_name == 'dev' && 'database-migrate-url-staging:latest') || '' }}
            BETTER_AUTH_SECRET=${{ github.ref_name == 'main' && 'better-auth-secret-prod:latest' || (github.ref_name == 'dev' && 'better-auth-secret-staging:latest') || '' }}
            S3_ACCESS_KEY_ID=${{ github.ref_name == 'main' && 's3-access-key-id-prod:latest' || (github.ref_name == 'dev' && 's3-access-key-id-staging:latest') || '' }}
            S3_SECRET_ACCESS_KEY=${{ github.ref_name == 'main' && 's3-secret-access-key-prod:latest' || (github.ref_name == 'dev' && 's3-secret-access-key-staging:latest') || '' }}
