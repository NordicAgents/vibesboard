name: Deploy Firebase Functions

on:
  push:
    branches: [dev, main]
    paths:
      - "functions/**"
  workflow_dispatch:

concurrency:
  group: deploy-functions-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "FIREBASE_PROJECT=${{ secrets.PROD_FIREBASE_PROJECT }}" >> $GITHUB_ENV
          else
            echo "FIREBASE_PROJECT=${{ secrets.STAGING_FIREBASE_PROJECT }}" >> $GITHUB_ENV
          fi

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

      - name: Deploy Functions
        run: npx firebase-tools deploy --only functions --project ${{ env.FIREBASE_PROJECT }} --force --non-interactive
