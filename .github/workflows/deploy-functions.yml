name: Deploy Firebase Functions

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/functions/**"
  workflow_dispatch:

concurrency:
  group: deploy-functions-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        env:
          REF_NAME: ${{ github.ref_name }}
          PROD_FIREBASE_PROJECT: ${{ secrets.PROD_FIREBASE_PROJECT }}
          STAGING_FIREBASE_PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "FIREBASE_PROJECT=$PROD_FIREBASE_PROJECT" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_PROJECT=$STAGING_FIREBASE_PROJECT" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/functions

      - name: Build
        run: npm run build
        working-directory: apps/functions

      - name: Deploy Functions
        run: npx firebase-tools deploy --only functions --project ${{ env.FIREBASE_PROJECT }} --force --non-interactive
