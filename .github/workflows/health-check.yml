name: Health Check

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging:
    name: Staging
    # A manual dispatch can select a non-default branch. Keep even these simple
    # probes on an ephemeral runner so a modified branch can never reach the
    # persistent runner fleet.
    runs-on: ubuntu-latest
    steps:
      - name: Health check (staging)
        id: check
        env:
          CHECK_URL: ${{ secrets.STAGING_NEXT_PUBLIC_APP_URL }}
        run: |
          if [ -z "$CHECK_URL" ]; then
            echo "::warning::No URL configured for staging"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$CHECK_URL")
          echo "status=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::staging returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "staging is healthy (HTTP $HTTP_CODE)"

      - name: Add failure to workflow summary
        if: failure()
        env:
          HTTP_STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo '## Staging health check failed' >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP status: $HTTP_STATUS" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production
    runs-on: ubuntu-latest
    steps:
      - name: Health check (production)
        id: check
        env:
          CHECK_URL: ${{ secrets.PROD_NEXT_PUBLIC_APP_URL }}
        run: |
          if [ -z "$CHECK_URL" ]; then
            echo "::warning::No URL configured for production"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$CHECK_URL")
          echo "status=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::production returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "production is healthy (HTTP $HTTP_CODE)"

      - name: Add failure to workflow summary
        if: failure()
        env:
          HTTP_STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo '## Production health check failed' >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP status: $HTTP_STATUS" >> "$GITHUB_STEP_SUMMARY"
