name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release Please
    # Release Please only calls the GitHub API. Keeping it on an isolated,
    # standard hosted runner avoids exposing the self-hosted fleet after the
    # repository is made public; hosted runners are free for public projects.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create release commits, tags, and releases.
      pull-requests: write # Required to create and update the release PR.
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
          target-branch: main
