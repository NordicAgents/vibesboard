name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release Please
    # This job runs only trusted code after a push to main. Pull-request jobs
    # use ephemeral GitHub-hosted VMs and never share this persistent runner.
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write # Required to create release commits, tags, and releases.
      pull-requests: write # Required to create and update the release PR.
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
          target-branch: main
