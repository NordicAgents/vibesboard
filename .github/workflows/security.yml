name: Security & Quality

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-analysis:
    name: Secrets, SAST, and vulnerabilities
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fork PR checks out its own tree, including .gitleaks.toml — a PR could
      # widen that allowlist to make the secret scan pass while scanning nothing.
      # On pull_request, pull the scan config from the trusted BASE ref instead.
      - name: Check out base-ref scan config (trusted)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: .base-config
          persist-credentials: false
          sparse-checkout: |
            .gitleaks.toml
          sparse-checkout-cone-mode: false

      - name: Resolve gitleaks config path
        id: gitleaks_config
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -f .base-config/.gitleaks.toml ]; then
            echo "path=/repo/.base-config/.gitleaks.toml" >> "$GITHUB_OUTPUT"
          else
            echo "path=/repo/.gitleaks.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan tracked files for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config ${{ steps.gitleaks_config.outputs.path }} --no-banner --redact=100

      # Invoked through `run:` rather than `uses: docker://…` on purpose. This
      # repository sets Actions to "allow select actions", and that allow-list
      # governs `uses:` only — a Docker Hub image is neither GitHub-owned, nor
      # from a verified creator, nor matchable by an owner/repo pattern, so the
      # `uses:` form was refused before any job started and the whole workflow
      # reported startup_failure. Docker invoked from a shell step is not
      # subject to that policy, which is also how the gitleaks step above runs.
      # The digest pin is preserved, so this is no weaker than the old form.
      - name: Run Semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:85782eaf09692e6dfb684cd3bad87ef315775814b01f76b4d15582e4ca7c1c89
          semgrep scan --error
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring

      # Defense in depth: a fork PR must not be able to smuggle in scanner
      # ignore files to suppress findings. The repo ships none, so removing them
      # on PRs is a no-op for trusted branches.
      - name: Drop untrusted scanner ignore files on PRs
        if: github.event_name == 'pull_request'
        run: rm -f .trivyignore .trivyignore.yaml .semgrepignore

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  complexity-analysis:
    name: Complexity regression
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lizard Runner
        uses: Uno-Takashi/Lizard-Runner@84be77b3a59d9a98a74c46018adfbd5110dc9744
        with:
          path: "."
          CCN: "15"
          # Pre-existing high-CCN functions across the codebase (chatwoot/agents
          # routes, AI prompt builders, etc.). Tolerate the current count so the
          # gate flags NEW complexity regressions rather than the existing backlog.
          ignore_warnings: "15"
