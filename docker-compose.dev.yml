services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: vibesboard_dev
      POSTGRES_USER: vibesboard
      POSTGRES_PASSWORD: vibesboard
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - vibesboard_pg:/var/lib/postgresql/data
      - ./packages/adapter-postgres/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibesboard -d vibesboard_dev']
      interval: 2s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:4@sha256:c1c24d89d06fcb8fc0fb5a049240dc292ff4a121ae05d7e74d64b58c421d2921
    ports:
      - '127.0.0.1:8888:8080'
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    # The upstream Docker Hub images are no longer public. Coolify builds this
    # release from MinIO source and includes mc, which also serves as the
    # healthcheck client because this image does not include curl.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vibesboard
      MINIO_ROOT_PASSWORD: vibesboard
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - vibesboard_minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'MC_HOST_local=http://vibesboard:vibesboard@localhost:9000 mc ready local']
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 vibesboard vibesboard &&
        (mc mb -p local/vibesboard-files || true) &&
        mc anonymous set none local/vibesboard-files &&
        mc ls local/
      "

volumes:
  vibesboard_pg:
  vibesboard_minio:
