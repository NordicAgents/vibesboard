services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vibesboard_dev
      POSTGRES_USER: vibesboard
      POSTGRES_PASSWORD: vibesboard
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - vibesboard_pg:/var/lib/postgresql/data
      - ./packages/adapter-postgres/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibesboard -d vibesboard_dev']
      interval: 2s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:4
    ports:
      - '8888:8080'
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vibesboard
      MINIO_ROOT_PASSWORD: vibesboard
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - vibesboard_minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 vibesboard vibesboard &&
        (mc mb -p local/vibesboard-files || true) &&
        mc anonymous set none local/vibesboard-files
      "

volumes:
  vibesboard_pg:
  vibesboard_minio:
