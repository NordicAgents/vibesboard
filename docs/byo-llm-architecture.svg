<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" font-family="ui-monospace,monospace" font-size="11">
  <rect width="920" height="680" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="460" y="32" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">BYO-LLM — File Map &amp; Data Flow</text>

  <!-- ─── Layer labels ─── -->
  <text x="12" y="62" fill="#8b949e" font-size="10">CONTRACTS</text>
  <text x="12" y="160" fill="#8b949e" font-size="10">STORAGE</text>
  <text x="12" y="290" fill="#8b949e" font-size="10">SERVICE LAYER</text>
  <text x="12" y="430" fill="#8b949e" font-size="10">RUNTIME</text>
  <text x="12" y="530" fill="#8b949e" font-size="10">API ROUTES</text>
  <text x="12" y="620" fill="#8b949e" font-size="10">UI</text>

  <!-- ─── CONTRACTS ─── -->
  <rect x="100" y="44" width="200" height="44" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="200" y="62" fill="#79c0ff" text-anchor="middle" font-weight="bold">contracts/ports/ai-provider.ts</text>
  <text x="200" y="78" fill="#8b949e" text-anchor="middle">ProviderModelSpec (union)</text>
  <text x="200" y="89" fill="#8b949e" text-anchor="middle">LlmProviderKind</text>

  <rect x="340" y="44" width="200" height="44" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="440" y="62" fill="#79c0ff" text-anchor="middle" font-weight="bold">contracts/types.ts</text>
  <text x="440" y="78" fill="#8b949e" text-anchor="middle">VibeAgent.llmConfigId</text>

