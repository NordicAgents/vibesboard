  <text x="155" y="173" fill="#8b949e" text-anchor="middle">tenant_llm_configs table</text>
  <text x="155" y="186" fill="#8b949e" text-anchor="middle">api_key_encrypted</text>
  <text x="155" y="197" fill="#8b949e" text-anchor="middle">kind / model_id / base_url</text>

  <rect x="290" y="140" width="170" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="375" y="158" fill="#56d364" text-anchor="middle" font-weight="bold">schema/agents.ts</text>
  <text x="375" y="173" fill="#8b949e" text-anchor="middle">agents.llm_config_id</text>
  <text x="375" y="186" fill="#8b949e" text-anchor="middle">(per-agent override)</text>

  <rect x="500" y="140" width="170" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="585" y="158" fill="#56d364" text-anchor="middle" font-weight="bold">schema/files.ts</text>
  <text x="585" y="173" fill="#8b949e" text-anchor="middle">files.embedding_provider</text>
  <text x="585" y="186" fill="#8b949e" text-anchor="middle">(tracks stale embeddings)</text>

  <rect x="710" y="140" width="170" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="795" y="158" fill="#56d364" text-anchor="middle" font-weight="bold">drizzle migrations</text>
  <text x="795" y="173" fill="#8b949e" text-anchor="middle">0012 table · 0013 RLS · 0014 col</text>

