  <text x="400" y="456" fill="#8b949e" text-anchor="middle">query embedding → vector search</text>

  <rect x="540" y="410" width="200" height="64" rx="6" fill="#161b22" stroke="#ffa657" stroke-width="1.5"/>
  <text x="640" y="428" fill="#ffa657" text-anchor="middle" font-weight="bold">file-search.ts</text>
  <text x="640" y="443" fill="#8b949e" text-anchor="middle">resolveEmbedder(tenantId)</text>
  <text x="640" y="456" fill="#8b949e" text-anchor="middle">chunk + embed at ingest time</text>

  <!-- ─── API ROUTES ─── -->
  <rect x="60" y="510" width="195" height="60" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="157" y="528" fill="#f0883e" text-anchor="middle" font-weight="bold">llm-configs/ routes</text>
  <text x="157" y="542" fill="#8b949e" text-anchor="middle">GET/POST /llm-configs</text>
  <text x="157" y="555" fill="#8b949e" text-anchor="middle">PATCH/DELETE/test /[id]</text>
  <text x="157" y="564" fill="#f85149" text-anchor="middle" font-size="9">requireTenantAdmin + BYO_LLM flag</text>

  <rect x="300" y="510" width="195" height="60" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="397" y="528" fill="#f0883e" text-anchor="middle" font-weight="bold">files/ingest route</text>
  <text x="397" y="542" fill="#8b949e" text-anchor="middle">POST /agents/[id]/files/ingest</text>
  <text x="397" y="555" fill="#8b949e" text-anchor="middle">upserts file record → ingest</text>

  <rect x="540" y="510" width="195" height="60" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="637" y="528" fill="#f0883e" text-anchor="middle" font-weight="bold">agent-creator route</text>
  <text x="637" y="542" fill="#8b949e" text-anchor="middle">POST /api/agent-creator</text>
  <text x="637" y="555" fill="#8b949e" text-anchor="middle">resolveProviderSpec → buildProviderModel</text>

  <!-- ─── UI ─── -->
  <rect x="60" y="600" width="310" height="50" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="215" y="618" fill="#e3b341" text-anchor="middle" font-weight="bold">settings/tenant/llm-providers/page.tsx</text>
  <text x="215" y="633" fill="#8b949e" text-anchor="middle">Add/Edit/Test/Enable/SetDefault/Delete</text>
  <text x="215" y="645" fill="#8b949e" text-anchor="middle">model dropdown (official IDs per provider)</text>

  <rect x="400" y="600" width="260" height="50" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="530" y="618" fill="#e3b341" text-anchor="middle" font-weight="bold">settings/layout.tsx</text>
  <text x="530" y="633" fill="#8b949e" text-anchor="middle">"LLM Providers" nav item</text>
  <text x="530" y="645" fill="#8b949e" text-anchor="middle">gated by BYO_LLM feature flag</text>

