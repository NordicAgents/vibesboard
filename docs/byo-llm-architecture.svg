  <rect x="60" y="270" width="200" height="80" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="160" y="288" fill="#d2a8ff" text-anchor="middle" font-weight="bold">cred-store/</text>
  <text x="160" y="303" fill="#8b949e" text-anchor="middle">CredStore interface</text>
  <text x="160" y="316" fill="#8b949e" text-anchor="middle">seal() / unseal() / revoke()</text>
  <text x="160" y="329" fill="#8b949e" text-anchor="middle">EncryptedDbCredStore (AES)</text>
  <text x="160" y="342" fill="#8b949e" text-anchor="middle">swap export → cloud backend</text>

  <rect x="300" y="270" width="220" height="80" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="410" y="288" fill="#d2a8ff" text-anchor="middle" font-weight="bold">tenant-llm-config.ts</text>
  <text x="410" y="303" fill="#8b949e" text-anchor="middle">CRUD (create/update/delete)</text>
  <text x="410" y="316" fill="#8b949e" text-anchor="middle">resolveProviderSpec()</text>
  <text x="410" y="329" fill="#8b949e" text-anchor="middle">resolveEmbedder()</text>
  <text x="410" y="342" fill="#8b949e" text-anchor="middle">getMigrateDb (BYPASSRLS)</text>

  <rect x="560" y="270" width="220" height="80" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="670" y="288" fill="#d2a8ff" text-anchor="middle" font-weight="bold">provider-registry.ts</text>
  <text x="670" y="303" fill="#8b949e" text-anchor="middle">ProviderFactoryRegistry</text>
  <text x="670" y="316" fill="#8b949e" text-anchor="middle">[K in LlmProviderKind] mapped type</text>
  <text x="670" y="329" fill="#8b949e" text-anchor="middle">buildProviderModel(spec)</text>
  <text x="670" y="342" fill="#8b949e" text-anchor="middle">openai · anthropic · google · compat</text>

