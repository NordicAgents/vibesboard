  <text x="817" y="528" fill="#8b949e" text-anchor="middle" font-size="10" font-weight="bold">Legend</text>
  <rect x="745" y="538" width="12" height="8" rx="2" fill="none" stroke="#388bfd" stroke-width="1.5"/>
  <text x="763" y="546" fill="#8b949e" font-size="9">Contracts / Types</text>
  <rect x="745" y="554" width="12" height="8" rx="2" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="763" y="562" fill="#8b949e" font-size="9">DB Schema / Migrations</text>
  <rect x="745" y="570" width="12" height="8" rx="2" fill="none" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="763" y="578" fill="#8b949e" font-size="9">Service Layer</text>
  <rect x="745" y="586" width="12" height="8" rx="2" fill="none" stroke="#ffa657" stroke-width="1.5"/>
  <text x="763" y="594" fill="#8b949e" font-size="9">Runtime / AI pipeline</text>
  <rect x="745" y="602" width="12" height="8" rx="2" fill="none" stroke="#f0883e" stroke-width="1.5"/>
  <text x="763" y="610" fill="#8b949e" font-size="9">API Routes</text>
  <rect x="745" y="618" width="12" height="8" rx="2" fill="none" stroke="#e3b341" stroke-width="1.5"/>
