  <rect x="60" y="410" width="200" height="64" rx="6" fill="#161b22" stroke="#ffa657" stroke-width="1.5"/>
  <text x="160" y="428" fill="#ffa657" text-anchor="middle" font-weight="bold">runtime.ts</text>
  <text x="160" y="443" fill="#8b949e" text-anchor="middle">resolveProviderSpec() before stream</text>
  <text x="160" y="456" fill="#8b949e" text-anchor="middle">runAgentStreamWithSpec()</text>
  <text x="160" y="469" fill="#8b949e" text-anchor="middle">previewToken → bypass</text>

  <rect x="300" y="410" width="200" height="64" rx="6" fill="#161b22" stroke="#ffa657" stroke-width="1.5"/>
  <text x="400" y="428" fill="#ffa657" text-anchor="middle" font-weight="bold">rag-retriever.ts</text>
