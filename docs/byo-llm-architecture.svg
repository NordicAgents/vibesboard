  <!-- provider-registry → runtime -->
  <line x1="640" y1="350" x2="220" y2="410" stroke="#d2a8ff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- runtime → api -->
  <line x1="160" y1="474" x2="157" y2="510" stroke="#ffa657" stroke-width="1.5"/>
  <!-- rag → api-ingest -->
  <line x1="400" y1="474" x2="397" y2="510" stroke="#ffa657" stroke-width="1.5"/>
  <!-- file-search → api-ingest -->
  <line x1="600" y1="474" x2="450" y2="510" stroke="#ffa657" stroke-width="1.5"/>
  <!-- api routes → ui -->
  <line x1="157" y1="570" x2="200" y2="600" stroke="#f0883e" stroke-width="1.5"/>
  <!-- llm-configs routes → ui -->
  <line x1="200" y1="570" x2="280" y2="600" stroke="#f0883e" stroke-width="1.5"/>

